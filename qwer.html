<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой проект</title>
</head>
<body>
    <form id="main-form" onsubmit="return checkForm(this)" method="post">
        <label for="name">Имя</label>
        <input type="text" name="name" id="name" placeholder="Введите имя"><br><br>
        <label for="pass">Пароль</label>
        <input type="password" name="pass" id="pass" placeholder="Введите пароль"><br><br>
        <label for="repass">Подтвердите пароль</label>
        <input type="password" name="repass" id="repass" placeholder="Павторите пароль"><br><br>
        <span>Пол</span>
        <input type="radio" name="state" id="male" value="Мужской">
        <label for="male">Мужской</label>
        <input type="radio" name="state" id="female" value="Женский">
        <label for="female">Женский</label><br><br>
        <input type="submit" name="submit" value="Готово">
    </form>
    <script src="script.js"></script>
</body>
</html>
